<div class="sheet-only sheet-only-settings">
    <div class="dialog-content sheet-only-settings__content">
        <form class="sheet-only-settings__form">
            <div class="sheet">
                <ol class="items-list inventory-list sheet-only-settings__list">
                    <li class="items-header sheet-only-settings__grid sheet-only-settings__header">
                        <label class="item-name noborder sheet-only-settings__player-heading">
                            {{localize 'Sheet-Only.players'}}
                        </label>
                        <label>Use Sheet Only</label>
                        <label>Allow Observer Role</label>
                        <label>Activate only in portrait view</label>

                        <label>Activation screen width</label>
                    </li>

                    <li>
                        <ol class="item-list sheet-only-settings__players">
                            {{#each players}}
                            <li class="item sheet-only-settings__grid sheet-only-settings__row" data-item-id="{{this.id}}">
                                <div class="item-name rollable sheet-only-settings__player-name">
                                    <h4>{{this.name}}</h4>
                                </div>

                                <div class="item-controls sheet-only-settings__control">
                                    <input
                                            type="checkbox"
                                            class="display"
                                            {{#if this.display}}checked{{/if}}
                                    />
                                </div>

                                <div class="item-controls sheet-only-settings__control">
                                    <input
                                            type="checkbox"
                                            class="allowObserver"
                                            {{#if this.allowObserver}}checked{{/if}}
                                    title="Allow players with role observer to use sheet only"
                                    />
                                </div>

                                <div class="item-controls sheet-only-settings__control">
                                    <input
                                            type="checkbox"
                                            class="activateOnPortrait"
                                            {{#if this.activateOnPortrait}}checked{{/if}}
                                    title="Triggers sheet-only mode only if the screen orientation is portrait."
                                    />
                                </div>

                                <div class="item-controls sheet-only-settings__control">
                                    <input
                                            type="number"
                                            class="screenwidth sheet-only-settings__screen-width"
                                            min="0"
                                            placeholder="0"
                                            value="{{this.screenwidth}}"
                                            title="Only activate if the screen width is smaller than entered value. Set to 0 to not check screen width."
                                    />
                                </div>


                            </li>
                            {{/each}}
                        </ol>
                    </li>
                </ol>
            </div>
        </form>
    </div>

    <hr class="sheet-only-settings__divider" />

    <div class="dialog-buttons sheet-only-settings__buttons">
        <button
                type="submit"
                name="submit"
                class="dialog-buttons save"
                data-button="request"
        >
            <i class="far fa-save"></i>
            {{localize 'Sheet-Only.button.save'}}
        </button>
    </div>
</div>
